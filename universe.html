<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вселенная любви</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем красивый рукописный шрифт из Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #6c376c; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: 'Dancing Script', cursive; /* Применяем шрифт к заголовку */
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 15px rgba(192, 125, 190, 0.8);
        }
        .back-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-decoration: none;
            font-family: 'Dancing Script', cursive; /* Применяем шрифт к кнопке */
            background: rgba(192, 125, 190, 0.6);
            padding: 10px 25px;
            border-radius: 20px;
            transition: 0.3s;
            z-index: 10;
            font-size: 1.2em;
        }
        .back-btn:hover { background: rgba(192, 125, 190, 0.9); }
    </style>
</head>
<body>

    <div id="ui">
        <h1 style="font-size: 4em; margin-bottom: 0;">Я тебя люблю</h1>
        <p style="font-family: Arial, sans-serif; font-size: 0.5em; opacity: 0.8;">Покрути неоновое сердце мышкой ✨</p>
    </div>
    
    <a href="index.html" class="back-btn">Назад</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const phrases = [
            "I love you", "Je t'aime", "Te amo", "Ich liebe dich", 
            "Ti amo", "Я тебя люблю", "愛してる", "사랑해", "我爱你",
            "S'agapo", "Eu te amo", "Jeg elsker dig", "Ik hou van jou",
            "Seni seviyorum", "Ana uhibbuka", "Main tumse pyar karta hoon",
            "Kocham Cię", "Jag älskar dig", "ฉันรักคุณ", "Aku cinta kamu",
            "Szeretlek", "Я люблю тебе", "Milujem ťa", "Volim te",
            "Jag älskar dig", "Jeg elsker deg", "ฉันรักคุณ", "T'estimo"
        ];

        const neonColor = '#ffffff'; 
        const glowColor = '#c07dbe'; 
        const bgColor = '#6c376c'; // Ваш новый темный оттенок

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(bgColor);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;

        // Функция создания НЕОНОВОГО текста с красивым шрифтом
        function createNeonTextTexture(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;
            
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // ПРИМЕНЯЕМ КРАСИВЫЙ ШРИФТ ЗДЕСЬ
            ctx.font = '700 60px "Dancing Script", cursive';

            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 25;
            ctx.fillStyle = glowColor;
            ctx.fillText(text, 256, 64);

            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ffccff'; 
            ctx.fillText(text, 256, 64);

            ctx.shadowBlur = 0;
            ctx.fillStyle = neonColor;
            ctx.fillText(text, 256, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // Функция запуска сердца (вызывается после загрузки шрифтов)
        function initHeart() {
            const pointsCount = 250; 
            for (let i = 0; i < pointsCount; i++) {
                const phi = Math.acos(-1 + (2 * i) / pointsCount);
                const theta = Math.sqrt(pointsCount * Math.PI) * phi;

                const x = 16 * Math.pow(Math.sin(phi), 3) * Math.sin(theta) * 0.5;
                const y = (13 * Math.cos(phi) - 5 * Math.cos(2 * phi) - 2 * Math.cos(3 * phi) - Math.cos(4 * phi)) * 0.5;
                const z = 16 * Math.pow(Math.sin(phi), 3) * Math.cos(theta) * 0.5;

                const phrase = phrases[Math.floor(Math.random() * phrases.length)];
                const material = new THREE.SpriteMaterial({ 
                    map: createNeonTextTexture(phrase),
                    transparent: true,
                    blending: THREE.AdditiveBlending 
                });
                const sprite = new THREE.Sprite(material);
                
                sprite.position.set(x, y, z);
                sprite.scale.set(2.8, 0.7, 1); 
                scene.add(sprite);
            }
        }

        // Ждем, пока все шрифты загрузятся, и только потом создаем сердце
        document.fonts.ready.then(() => {
            initHeart();
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
